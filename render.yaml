services:
  - type: web
    name: belajaradaptif-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SYNC_SECRET
        sync: false
      - key: IMAGE_GEN_ENABLED
        value: true
